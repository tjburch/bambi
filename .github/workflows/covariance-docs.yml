name: Manual covariance documentation and package checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          environments: py312
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.34'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - name: Style and lint
        run: |
          pixi run -e py312 pre-commit run --all
          pixi run -e py312 pylint bambi
      - name: Build distribution artifacts
        run: uv build --wheel --out-dir dist
      - name: Render full documentation without model execution
        run: pixi run -e py312 quarto render docs --no-execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: covariance-docs-package-${{ github.sha }}
          retention-days: 7
          path: |
            dist/
            docs/_site/
